<!--
  Referência estática do componente "Card de KPI".
  Gerado dinamicamente em produção por kpiCard() em js/script.js.
  Não é carregado pela aplicação — apenas documentação visual.
-->
<article class="kpi-card">
  <div class="kpi-card__icon">
    <!-- ícone SVG 18x18, ver js/script.js -> ICONS -->
  </div>
  <div class="kpi-card__body">
    <span class="kpi-card__label">TURNOVER (%)</span>
    <strong class="kpi-card__value">4,8%</strong>
    <span class="kpi-card__delta kpi-card__delta--down">-0,6 p.p. vs. mês anterior</span>
  </div>
</article>
