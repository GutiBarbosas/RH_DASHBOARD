  Esqueleto de referência para um módulo novo (ex: Turnover, Absenteísmo).
  Reflete a estrutura que a função renderNomeDoModulo(container) deve montar
  em js/script.js. Não é carregado pela aplicação — apenas documentação.
-->
<section class="view" data-view="nome-do-modulo">

  <!-- 1. Barra de filtros (Filters.createFilterBar) -->
  <div class="filter-bar"> ... </div>

  <!-- 2. Cabeçalho de seção -->
  <div class="view__section-header">
    <div>
      <h2 class="view__section-title">Título da seção</h2>
      <p class="view__section-desc">Descrição breve do que está sendo exibido</p>
    </div>
  </div>

  <!-- 3. Cards de KPI -->
  <div class="kpi-grid">
    <!-- kpi-card.html x N -->
  </div>

  <!-- 4. Gráficos -->
  <div class="chart-grid">
    <!-- chart-card x N (placeholder até integração) -->
  </div>

  <!-- 5. Tabela de dados -->
  <div class="table-card"> ... </div>

</section>
